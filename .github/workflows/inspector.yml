name: Inspector
on:
  workflow_dispatch:
    inputs:
      months:
        description: "Months to judge on"
        default: "12"
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Carry Lab
        env:
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python ema200_lab.py
      - name: Save the report
        run: |
          mkdir -p /tmp/report && cp ema200_lab.json /tmp/report/
          git config user.name "carry-lab"
          git config user.email "carry-lab@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin carry-lab && git reset -q --hard origin/carry-lab
            cp /tmp/report/* .
            git add ema200_lab.json
            git diff --cached --quiet && exit 0
            git commit -qm "EMA 200 Lab report" && git push -q origin HEAD:carry-lab && exit 0
            sleep 5
          done
          exit 1
