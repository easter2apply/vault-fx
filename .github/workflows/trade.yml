name: Vault FX
on:
  schedule:
    - cron: "7 * * * 0-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "full = scan now · auto = what the timer uses"
        default: "full"
        type: choice
        options: [full, auto]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: vault-fx
  cancel-in-progress: false
jobs:
  trade:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Vault FX
        id: bot
        env:
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
          OANDA_ENV: ${{ vars.OANDA_ENV }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python vault_fx.py --out site/index.html --mode "${{ inputs.mode || 'auto' }}"
      - name: 200 EMA Tracker (side test, pretend money)
        continue-on-error: true
        env:
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
        run: python ema_tracker.py --out site/ema.html
      - name: Save bot memory
        run: |
          git config user.name "vault-fx"
          git config user.email "vault-fx@users.noreply.github.com"
          git add fx_state.json 2>/dev/null || true
          git add ema_state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Update state" && git pull --rebase && git push)
      - if: steps.bot.outputs.deploy == 'true'
        uses: actions/configure-pages@v5
      - if: steps.bot.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - if: steps.bot.outputs.deploy == 'true'
        id: deploy
        uses: actions/deploy-pages@v4
